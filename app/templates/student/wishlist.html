{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <h2>Danh sách yêu thích</h2>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Mã học phần</th>
                <th>Thao tác</th>
            </tr>
        </thead>

        <tbody>
            {% for item in records %}
            <tr>
                <td>{{ item.course_id }}</td>
                <td>
                    <form method="post"
                          action="{{ url_for('student.wishlist_remove', record_id=item.record_id) }}">
                        <button class="btn btn-danger btn-sm">Xóa</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="2">Chưa có học phần yêu thích.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
{% endblock %}
